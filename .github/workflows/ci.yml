name: Linux CI

on:
  push:
    branches: [main, "production/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Python syntax
        run: python3 -m py_compile evofox.py evofox-gtk.py evofox-gui.py
      - name: Shell syntax
        run: |
          bash -n run-evofox
          bash -n fix-permissions.sh
          bash -n packaging/arch/evofox-gui
      - name: Build C CLI
        run: make -C tools clean all
      - name: Rust tests and release build
        working-directory: tools/evofox-rs
        run: |
          cargo test --locked
          cargo build --release --locked

  arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install package dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust python gtk3 python-gobject
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build Arch package
        run: su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --syncdeps --noconfirm"
